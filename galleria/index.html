<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2300008B'/></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #00008B;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 columns */
      gap: 12px;                             /* blue space between photos */
      padding: 6px;                         /* blue space around the edge */
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;      /* makes every photo a perfect square */
      object-fit: cover;
      display: block;
      background: #000066;      /* fallback while loading */
    }

    /* Optional: slight hover effect */
    .gallery img:hover {
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>

  <div class="gallery">
    <!-- Just keep adding more images like this -->
    <img src="../images/1.JPG" alt="">
    <img src="../images/2.JPG" alt="">
    <img src="../images/3.JPG" alt="">
    <img src="../images/4.JPG" alt="">
    <img src="../images/5.JPG" alt="">
    <img src="../images/6.JPG" alt="">
    <img src="../images/7.JPG" alt="">
    <img src="../images/8.JPG" alt="">
    <img src="../images/9.JPG" alt="">
    <img src="../images/10.JPG" alt="">
    <img src="../images/11.JPG" alt="">
    <img src="../images/12.JPG" alt="">
    <!-- Add as many as you want... -->
  </div>

</body>
</html>
