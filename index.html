<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #00008B;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 36px 40px;
      border-radius: 20px;
      /* soft glow like in your screenshot */
      box-shadow: rgba(0, 0, 80, 0.4);
    }

    input {
      width: 280px;
      padding: 16px 24px;
      font-size: 1.1rem;
      border: none;
      border-radius: 14px;
      background: white;
      color: #333;
      text-align: center;
      outline: none;
    }

    input::placeholder {
      color: #999;
    }

    button {
      width: 280px;
      padding: 16px;
      font-size: 1.15rem;
      font-weight: 500;
      border: none;
      border-radius: 14px;
      background: black;
      color: white;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    /* Hover effect you requested */
    button:hover {
      background: #00008B;   /* same blue as the background */
    }

    .error {
      color: #ff6b6b;
      font-size: 0.95rem;
      height: 0;
      overfliw: hidden; 
      transition: height 0.2s;
    }
  </style>
</head>
<body>
  <div class="box">
    <input type="password" id="password" placeholder="password" autofocus>
    <button onclick="checkPassword()">Enter</button>
    <div class="error" id="error"></div>
  </div>
