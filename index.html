<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #00008B;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 36px 40px;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.3);
    }

    input, button {
      width: 280px;
      padding: 16px;
      font-size: 1.1rem;
      border: none;
      border-radius: 14px;
      outline: none;
    }

    input {
      background: white;
      color: #333;
      text-align: center;
      padding: 16px 24px;
    }

    input::placeholder {
      color: #999;
    }

    button {
      font-size: 1.15rem;
      font-weight: 500;
      background: black;
      color: white;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    @media (hover: hover) {
      button:hover {
        background: #00008B;
      }
    }

    .error {
      color: #ff3b3b;
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: -8px; /* prevents layout jump */
    }
  </style>
</head>
<body>

  <form class="box" onsubmit="handleSubmit(event)">
    <input type="password" id="password" placeholder="password" autofocus>
    <button type="submit">Enter</button>
    <div class="error" id="error"></div>
  </form>

  <script>
    const correctPassword = "77one";
    let errorTimeout;

    function handleSubmit(e) {
      e.preventDefault();
      checkPassword();
    }

    function checkPassword() {
      const input = document.getElementById("password");
      const error = document.getElementById("error");
      const value = input.value.trim();

      if (!value) return; // empty → do nothing

      clearTimeout(errorTimeout);

      if (value === correctPassword) {
        sessionStorage.setItem("authenticated", "true");
        window.location.href = "home.html"; // change to "home" if using clean URL
      } else {
        error.textContent = "Wrong";
        input.value = "";
        input.focus();

        errorTimeout = setTimeout(() => {
          error.textContent = "";
        }, 3000);
      }
    }

    // Clear error as soon as user starts typing
    document.getElementById("password").addEventListener("input", () => {
      clearTimeout(errorTimeout);
      document.getElementById("error").textContent = "";
    });
  </script>
</body>
</html>
