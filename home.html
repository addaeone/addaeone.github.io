<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

  .split {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  .side {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-decoration: none;
    overflow: hidden;
  }

  /* Left side */
  .left {
    background: #00008B;
  }

  /* Right side */
  .right {
    background: #00008B url('Gallery.jpg') center/cover no-repeat;
  }
  .right::before {
    content: '';
    position: absolute;
    inset: 0;
    background: inherit;
    filter: blur(12px);
    transform: scale(1.1);
  }

  /* The thin white line */
  .split::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 5px;
    background: white;
    z-index: 10;
  }

  /* Text */
  .label {
    position: relative;
    z-index: 2;
    color: white;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 500;
    letter-spacing: 0.05em;
    transition: opacity 0.3s ease;
  }

  .label .hover {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .side:hover .label .main { opacity: 0; }
  .side:hover .label .hover { opacity: 1; }
</style>
</head>
<body>
  <div class="split">
    <!-- Left -->
    <a href="/shop" class="side left">
      <div class="label">
        <span class="main">店</span>
        <span class="hover">SHOP</span>
      </div>
    </a>

    <!-- Right -->
    <a href="/galleria" class="side right">
      <div class="label">
        <span class="main">ガレリア</span>
        <span class="hover">GALLERIA</span> <!-- change this if you want different hover text -->
      </div>
    </a>
  </div>
</body>
</html>
