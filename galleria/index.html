<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2300008B'/></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #00008B;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 8px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      cursor: pointer;
      background: #000066;
      transition: opacity 0.2s ease;
    }

    .gallery img:hover {
      opacity: 0.9;
    }

    /* Fullscreen view */
    .fullscreen {
      position: fixed;
      inset: 0;
      background: #00008B;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
    }

    .fullscreen img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      width: auto;
      height: auto;
      aspect-ratio: auto;
    }
  </style>
</head>
<body>

  <div class="gallery" id="gallery">
    <!-- Add your images here -->
    <img src="../images/1.JPG" alt="">
    <img src="../images/2.JPG" alt="">
    <img src="../images/3.JPG" alt="">
    <img src="../images/4.JPG" alt="">
    <img src="../images/5.JPG" alt="">
    <img src="../images/6.JPG" alt="">
    <img src="../images/7.JPG" alt="">
    <img src="../images/8.JPG" alt="">
    <img src="../images/9.JPG" alt="">
    <img src="../images/10.JPG" alt="">
    <img src="../images/11.JPG" alt="">
    <img src="../images/12.JPG" alt="">
    <img src="../images/13.JPG" alt="">
    <img src="../images/14.JPG" alt="">
    <img src="../images/15.JPG" alt="">
    <img src="../images/16.JPG" alt="">
    <img src="../images/17.JPG" alt="">
    <img src="../images/18.JPG" alt="">
    <img src="../images/19.JPG" alt="">
    <img src="../images/20.JPG" alt="">
    <img src="../images/21.JPG" alt="">
    <!-- Keep adding more images... -->
  </div>

  <script>
    const gallery = document.getElementById('gallery');

    gallery.addEventListener('click', function(e) {
      if (e.target.tagName === 'IMG') {
        // Create fullscreen container
        const fullscreen = document.createElement('div');
        fullscreen.className = 'fullscreen';

        // Clone the clicked image
        const fullImg = e.target.cloneNode();
        fullscreen.appendChild(fullImg);

        // Add to page
        document.body.appendChild(fullscreen);

        // Click anywhere to close
        fullscreen.addEventListener('click', function() {
          fullscreen.remove();
        });
      }
    });
  </script>

</body>
</html>
