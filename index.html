<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #00008B;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 36px 40px;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.3);
    }

    input {
      width: 280px;
      padding: 16px 24px;
      font-size: 1.1rem;
      border: none;
      border-radius: 14px;
      background: white;
      color: #333;
      text-align: center;
      outline: none;
    }

    input::placeholder {
      color: #999;
    }

    button {
      width: 280px;
      padding: 16px;
      font-size: 1.15rem;
      font-weight: 500;
      border: none;
      border-radius: 14px;
      background: black;
      color: white;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    button:hover {
      background: #00008B;
    }

    .error {
      color: #ff6b6b;
      font-size: 0.95rem;
      height: 20px;              /* ← fixed typo (was hheight) */
      margin-top: -8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <!-- ★★★ FIX: Wrapped in a form so Enter/Return works on Mac & iPhone ★★★ -->
    <form id="passwordForm" onsubmit="return handleSubmit(event)">
      <input type="password" id="password" placeholder="password" autofocus autocomplete="off">
      <button type="submit">Enter</button>
    </form>

    <div class="error" id="error"></div>
  </div>

  <script>
    const correctPassword = "77one";   // ← change this to your real password
    let errorTimeout;

    function handleSubmit(e) {
      e.preventDefault();          // stops the page from reloading
      checkPassword();
      return false;
    }

    function checkPassword() {
      const input = document.getElementById("password");
      const error = document.getElementById("error");
      const value = input.value;

      clearTimeout(errorTimeout);

      if (value === correctPassword) {
        sessionStorage.setItem("authenticated", "true");
        error.textContent = "";
        // window.location.href = "secret.html";   // optional redirect
      } else {
        error.textContent = "Wrong password";
        input.value = "";
        input.focus();

        // Auto-clear the message after 5 seconds
        errorTimeout = setTimeout(() => {
          error.textContent = "";
        }, 5000);
      }
    }

    // Clear the error as soon as the user starts typing again
    document.getElementById("password").addEventListener("input", () => {
      clearTimeout(errorTimeout);
      document.getElementById("error").textContent = "";
    });
  </script>
</body>
</html>
