<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2300008B'/></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #00008B;
    }

    .split {
      display: flex;
      height: 100%;
      height: 100dvh;
      width: 100vw;
      position: relative;
      background: #00008B;
    }

    .side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      text-decoration: none;
      overflow: hidden;
    }

    .left {
      background: #00008B;
    }

    .right {
      background: #00008B;
    }

    /* Blurred image on hover (desktop) */
    .right::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('../images/Gallery.png') center/cover no-repeat;
      filter: blur(14px);
      transform: scale(1.1);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 1;
      pointer-events: none;
    }

    .right:hover::before {
      opacity: 1;
    }

    /* Vertical white line (desktop) */
    .split::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 5px;
      background: white;
      z-index: 10;
      transform: translateX(-50%);
    }

    /* Text */
    .label {
      position: relative;
      z-index: 2;
      color: white;
      font-size: clamp(2.8rem, 8vw, 6rem);
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .label .hover {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .side:hover .label .main {
      opacity: 0;
    }

    .side:hover .label .hover {
      opacity: 1;
    }

    /* ========== MOBILE VERSION ========== */
    @media (max-width: 768px) {
      .split {
        flex-direction: column; /* horizontal split */
      }

      /* Change white line to horizontal */
      .split::after {
        top: 50%;
        bottom: auto;
        left: 0;
        right: 0;
        width: 100%;
        height: 5px;
        transform: translateY(-50%);
      }

      /* Optional: slightly smaller text on mobile */
      .label {
        font-size: clamp(2.4rem, 11vw, 4.5rem);
      }
    }
  </style>
</head>
<body>

  <script>
    if (sessionStorage.getItem("authenticated") !== "true") {
      window.location.href = "/";
    }
  </script>

  <div class="split">
    <!-- Top on mobile / Left on desktop -->
    <a href="/shop" class="side left">
      <div class="label">
        <span class="main">店</span>
        <span class="hover">SHOP</span>
      </div>
    </a>

    <!-- Bottom on mobile / Right on desktop -->
    <a href="/galleria" class="side right">
      <div class="label">
        <span class="main">ガレリア</span>
        <span class="hover">GALLERIA</span>
      </div>
    </a>
  </div>

</body>
</html>
